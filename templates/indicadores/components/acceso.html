{# Tarjeta de acceso a una pantalla. Quien la incluye decide si se muestra con {% if perms.app.permiso %} #}
<div class="col-sm-6 col-lg-3">
    <a href="{{ url }}" class="card border-0 shadow-sm h-100 text-decoration-none tarjeta-acceso">
        <div class="card-body">
            <i class="bi {{ icono }} fs-3 text-danger"></i>
            <h6 class="fw-bold text-dark mt-2 mb-1">{{ titulo }}</h6>
            <p class="text-muted small mb-0">{{ texto }}</p>
        </div>
    </a>
</div>
