<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGR — Iniciar Sesión | Municipalidad de La Serena</title>
    
    <link href="https://framework.laserena.cl/css/frameworkV1.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css" />

    <style>
        body {
            background: linear-gradient(135deg, #1a0000 0%, #AD0000 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .btn-muni { background-color: #AD0000; color: #ffffff !important; border: none; }
        .btn-muni:hover { background-color: #7a0000; }
    </style>
</head>
<body>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5 col-lg-4">
            <div class="card border-0 shadow-lg rounded-3 overflow-hidden">
                <div class="card-body p-4 p-md-5 text-center">
                    <img src="https://framework.laserena.cl/img/laserenaFuturo-Color.png" alt="La Serena Futuro" class="img-fluid mb-3" style="max-height: 70px;">
                    <h5 class="fw-bold text-dark mb-1">SGR MUNICIPAL</h5>
                    <p class="text-muted small mb-4">Sistema de Gestión y Control Territorial</p>

                    <form method="post">
                        {% csrf_token %}
                        {% if form.errors %}
                        <div class="alert alert-danger py-2 small mb-3 text-start">
                            Rut o contraseña incorrectos. Por favor reintente.
                        </div>
                        {% endif %}

                        <div class="form-floating mb-3 text-start">
                            <input type="text" name="username" class="form-control" id="id_username" placeholder="12.345.678-9" required autofocus>
                            <label for="id_username"><i class="bi bi-person me-1"></i> RUT</label>
                        </div>

                        <div class="form-floating mb-4 text-start">
                            <input type="password" name="password" class="form-control" id="id_password" placeholder="Contraseña" required>
                            <label for="id_password"><i class="bi bi-lock me-1"></i> Contraseña</label>
                        </div>

                        <button type="submit" class="btn btn-muni w-100 py-2 fw-bold shadow-sm">
                            <i class="bi bi-box-arrow-in-right me-1"></i> Iniciar Sesión
                        </button>
                    </form>
                </div>
                <div class="card-footer bg-light text-center py-2">
                    <small class="text-muted" style="font-size: 0.75rem;">Ilustre Municipalidad de La Serena &copy; {% now "Y" %}</small>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
