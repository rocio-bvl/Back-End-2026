<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGR — {% block title %}Acceso{% endblock %} | Municipalidad de La Serena</title>

    <link href="https://framework.laserena.cl/css/frameworkV1.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css" />

    {# Mismo estilo que el login: las pantallas de recuperación se ven antes de iniciar sesión #}
    <style>
        body {
            background: linear-gradient(135deg, #1a0000 0%, #AD0000 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .btn-muni { background-color: #AD0000; color: #ffffff !important; border: none; }
        .btn-muni:hover { background-color: #7a0000; }
    </style>
</head>
<body>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card border-0 shadow-lg rounded-3 overflow-hidden">
                <div class="card-body p-4 p-md-5">
                    <div class="text-center">
                        <img src="https://framework.laserena.cl/img/laserenaFuturo-Color.png" alt="La Serena Futuro" class="img-fluid mb-3" style="max-height: 70px;">
                        <h5 class="fw-bold text-dark mb-1">{% block encabezado %}SGR MUNICIPAL{% endblock %}</h5>
                    </div>
                    {% block contenido %}{% endblock %}
                </div>
                <div class="card-footer bg-light text-center py-2">
                    <small class="text-muted" style="font-size: 0.75rem;">Ilustre Municipalidad de La Serena &copy; {% now "Y" %}</small>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
