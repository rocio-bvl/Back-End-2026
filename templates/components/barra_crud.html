{% comment %}
Barra de acciones de un listado: Buscar + Agregar.
Parámetros: url_buscar, url_agregar, texto_agregar (opcional), deshabilitado (opcional).
El buscador envía ?q= a la ruta indicada (el buscador de Django Admin).
{% endcomment %}
<div class="d-flex flex-wrap gap-2 align-items-center">
    <form method="get" action="{{ url_buscar|default:'#' }}" class="d-flex" role="search">
        <input type="search" name="q" class="form-control form-control-sm" placeholder="Buscar..." aria-label="Buscar">
        <button type="submit" class="btn btn-sm btn-outline-dark ms-1 text-nowrap">
            <i class="bi bi-search me-1"></i>Buscar
        </button>
    </form>
    <a href="{{ url_agregar|default:'#' }}" class="btn btn-sm text-nowrap {% if deshabilitado %}btn-secondary disabled{% else %}btn-muni{% endif %}" {% if deshabilitado %}aria-disabled="true"{% endif %}>
        <i class="bi bi-plus-circle me-1"></i>{{ texto_agregar|default:"Agregar" }}
    </a>
</div>
